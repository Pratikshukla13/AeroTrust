# AeroTrust Synthetic World Configuration
# Strictly synthetic parameters. No real aircraft or personal identifiers.

version: "1.0.0"

seeds:
  dev: 42
  test: 1337
  holdout: 2024

# Default generation sizing (balanced for quick laptop runs & thoroughness)
scale:
  n_aircraft: 600
  n_flights: 6000
  n_days: 7
  sampling_interval_seconds: 30

fleet_distribution:
  A320-family: 0.55
  A330: 0.20
  A350: 0.15
  other: 0.10

# Traffic Routing and Density Shaping (Phase 2 Option A)
traffic_shaping:
  corridor_flight_fraction: 0.70       # 70% of flights follow named corridors
  direct_flight_fraction: 0.30         # 30% off-corridor / direct routing (preserves sparse cells)
  departure_banks_hours: [6.5, 11.5, 16.5, 20.5]  # 4 daily banks: morning, midday, afternoon, evening
  departure_bank_sigma_minutes: 40.0   # Gaussian spread around bank peaks
  corridor_lateral_jitter_km: 2.5      # Lateral polyline jitter to maintain H3 cell tube coherence

# Named Airway Corridors across interference regions and clean controls
corridors:
  - id: "CORR-BAL-01"
    name: "Baltic Coastway North"
    region: "Baltic"
    is_control: false
    waypoints:
