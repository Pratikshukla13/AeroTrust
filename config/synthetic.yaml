      - [25.25, 55.36]  # Dubai
      - [24.43, 54.65]  # Abu Dhabi
  - id: "CORR-MEA-02"
    name: "Emirates-Oman Corridor"
    region: "Middle East"
    is_control: false
    waypoints:
      - [25.25, 55.36]  # Dubai
      - [24.00, 56.50]  # Al Ain / Sohar
      - [23.59, 58.28]  # Muscat
  - id: "CORR-WE-01"
    name: "Western Europe Trunk"
    region: "Western Europe"
    is_control: true
    waypoints:
      - [48.72, 2.36]   # Paris Orly
      - [49.00, 2.55]   # Paris CDG
      - [49.50, 5.00]   # Luxembourg border
      - [50.03, 8.57]   # Frankfurt
  - id: "CORR-NAT-01"
    name: "North Atlantic Track Zulu"
    region: "North Atlantic"
    is_control: true
    waypoints:
