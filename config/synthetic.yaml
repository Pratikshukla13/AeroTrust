      - [53.50, -10.00] # Shannon exit
      - [55.00, -25.00] # Oceanic midpoint
      - [46.00, -50.00] # Gander entry

# Regional traffic allocation (preserves clean controls and deliberately sparse areas)
regional_flight_distribution:
  Baltic: 0.22
  Eastern Mediterranean: 0.28
  Black Sea: 0.16
  Middle East: 0.24
  Western Europe: 0.08   # Clean control
  North Atlantic: 0.02   # Clean control & deliberately sparse for abstention exercise

# Silent Acceptance probability when spoofed (by family)
# Modulates whether NIC/NACp stay high (silent acceptance) or drop during a spoofing event
silent_acceptance_probability:
  A320-family: 0.40
  A330: 0.25
  A350: 0.15
  other: 0.30

# Spatial Resolution (README Section 3 / Phase 0.5)
spatial_indexing:
  h3_interference_cell_resolution: 5  # Coarse resolution (4 or 5) for regional interference cells
  h3_track_point_resolution: 7        # Fine resolution (~1.2 km) for individual track points

# Flight Duration Distribution (Realistic airline operations: mostly 1-5h with some short hops)
duration_profile:
  short_flight_fraction: 0.15         # 35 to 55 minutes
  short_duration_minutes_range: [35, 55]
  medium_flight_fraction: 0.65        # 1 to 3 hours (60 to 180 min)
  medium_duration_minutes_range: [60, 180]
  long_flight_fraction: 0.20          # 3 to 5.5 hours (180 to 330 min)
  long_duration_minutes_range: [180, 330]

# Difficulty Knobs (tunable for testing detector sensitivity limits)
difficulty_knobs:
  noise_level_sigma_meters: 15.0      # Standard sensor noise on baro/geo alts
  # Continuous distribution including subtle and larger disturbances:
  spoof_offset_meters_range: [30.0, 800.0]
  spoof_altitude_offset_meters_range: [30.0, 800.0]
  spoof_horizontal_offset_meters_range: [50.0, 1000.0]
  spoof_drift_rate_mps_range: [0.5, 8.0]
  coverage_dropout_probability: 0.04 # Probability of missing track points (gaps)
  turbulence_spike_probability: 0.03 # Hard negative: sudden vrate spike in cruise
  baro_drift_error_probability: 0.02 # Hard negative: baro error without GNSS spoofing
  go_around_probability: 0.03        # Hard negative: aborted landing & sudden climb profile

# Target Regions & Synthetic Hubs
regions:
  Baltic:
    center: [57.5, 21.5]
    airports:
      - { code: "XBAL", name: "Synthetic Baltic Hub Alpha", lat: 56.92, lon: 23.97 }
      - { code: "XBBE", name: "Synthetic Baltic Hub Beta", lat: 59.41, lon: 24.83 }
