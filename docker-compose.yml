services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aerotrust_postgis
    environment:
      POSTGRES_USER: ${DB_USER:-aerotrust}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aerotrust_secret}
      POSTGRES_DB: ${DB_NAME:-aerotrust}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aerotrust} -d ${DB_NAME:-aerotrust}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
